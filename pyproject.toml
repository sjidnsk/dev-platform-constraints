[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-platform-constraints"
version = "0.1.0"
description = "月面路径规划的 P0 栅格地图、平台约束、代价图和 A* 闭环。"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
